{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events | Eventia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Essential layout styles to ensure views work */
        .view-section { display: none; }
        .view-section.active { display: block; }
        .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    </style>
</head>

<body class="dashboard-body">

    <nav class="landing-nav" id="landing-navbar" style="background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 1rem 2rem;">
        <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'assets/logo_fixed.png' %}" alt="Eventia" class="logo-img" style="height: 40px;">
            </a>

            <div class="nav-links" style="display: flex; gap: 2rem;">
                <a href="#" class="att-nav-link active" data-view="home">Home</a>
                <a href="#" class="att-nav-link" data-view="history">History</a>
                <a href="#" class="att-nav-link" data-view="profile">Profile</a>
            </div>

            <div class="user-menu" style="display: flex; align-items: center; gap: 1rem;">
                <div class="user-info" style="text-align: right;">
                    <span style="display: block; font-weight: 600; color: #333;">{{ user.username }}</span>
                    <span style="display: block; font-size: 0.8rem; color: #666;">Attendee</span>
                </div>
                <div class="user-avatar" style="width: 40px; height: 40px; background: #004e92; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline" style="margin-left: 10px;">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 2rem 0; min-height: 80vh; max-width: 1200px; margin: 0 auto;">

        {% if messages %}
        <div style="margin-bottom: 2rem;">
            {% for message in messages %}
            <div style="padding: 1rem; background: #e8f5e9; color: #2e7d32; border-radius: 8px; border: 1px solid #c8e6c9;">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <section id="view-home" class="view-section active"></section>
        <section id="view-history" class="view-section"></section>
        <section id="view-profile" class="view-section"></section>
    </main>

    <footer class="site-footer" style="background: white; border-top: 1px solid #eee; padding: 3rem 0; margin-top: auto;">
        <div class="container" style="text-align: center; color: #666;">
            <p>&copy; 2026 Eventia. All rights reserved.</p>
        </div>
    </footer>

    <script>
        window.DJANGO_EVENTS = {{ events_json|safe }};
        window.DJANGO_PROFILE = {{ profile_json|safe }};
    </script>

    <script src="{% static 'js/attendee-logic.js' %}"></script>

</body>
</html>
