{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Eventia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'dashboard' %}" class="logo" id="nav-logo">
                <img src="{% static 'assets/eventia_logo_new.png' %}" alt="Eventia Logo" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="{% url 'dashboard' %}" class="btn-text">Home</a>
                <a href="{% url 'signup_attendee' %}" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>

        <div id="login-form-container" class="auth-form-container">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Login as an Attendee</p>
            </div>

            <form id="login-form" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="login-email">Email Address or Phone Number</label>
                    <input type="text" name="username" id="login-email" placeholder="" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" name="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="{% url 'password_recovery' %}" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="vendor-organizer-link">
                <p>Are you a vendor or organizer?</p>
                <a href="{% url 'login_business' %}" class="btn btn-outline btn-sm">Sign in as Vendor or Organizer</a>
            </div>

            <div class="form-footer">
                <p>New to Eventia? <a href="{% url 'signup_attendee' %}" id="link-to-signup">Create an account</a></p>
                <a href="{% url 'dashboard' %}" class="back-to-home">Back to Home</a>
            </div>
        </div>
    </main>

    <script src="{% static 'js/app2.js' %}"></script>
    <script>
        // BYPASS SERVER CACHE:
        // The server is stubbornly caching the old app.js which contains the intercept blocks.
        // We use a capture-phase event listener here to intercept the submit event at the top 
        // of the DOM and halt propagation. This guarantees the buggy cached app.js never 
        // receives the event, preventing it from calling e.preventDefault() and breaking the form.
        document.addEventListener('submit', function (e) {
            if (e.target && e.target.id === 'login-form') {
                e.stopImmediatePropagation();
                e.stopPropagation();
            }
        }, true);
    </script>
</body>

</html>
