{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Log In | Eventia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'dashboard' %}" class="logo" id="nav-logo">
                <img src="{% static 'assets/logo_fixed.png' %}" alt="Eventia Logo" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="{% url 'dashboard' %}" class="btn-text">Home</a>
                <a href="{% url 'signup_business' %}" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="main-content" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>

        <div id="login-form-container" class="auth-form-container">
            <div class="form-header">
                <h2>Business Login</h2>
                <p>Access your vendor or organizer dashboard</p>
            </div>

            <div class="role-selector">
                <label>I am a(n):</label>
                <div class="role-tabs">
                    <div class="role-tab active" data-target="login" data-role="organizer">Organizer</div>
                    <div class="role-tab" data-target="login" data-role="vendor">Vendor</div>
                </div>
            </div>

            <form id="login-form" method="POST">
                {% csrf_token %}
                
                <input type="hidden" name="login_role" id="login-role-input" value="organizer">
                
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="text" name="username" id="login-email" placeholder="email@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" name="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="{% url 'password_recovery' %}" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Sign In as <span class="current-role-text">Organizer</span>
                </button>
            </form>

            <div class="attendee-link">
                <p>Just looking to attend events?</p>
                <a href="{% url 'login_attendee' %}" class="btn btn-outline btn-sm">Sign in as Attendee</a>
            </div>

            <div class="form-footer">
                <p>New to Eventia? <a href="{% url 'signup_business' %}" id="link-to-signup">Create a business account</a></p>
                <a href="{% url 'dashboard' %}" class="back-to-home">Back to Home</a>
            </div>
        </div>
    </main>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
